name: minesweeper
version: 0.3.1

authors:
  - wolfgang

# Build with `shards build minesweeper` (binary lands in bin/).
# Run directly with `crystal run src/minesweeper-gui.cr`.
# Web build (WebAssembly, crymble-ui >= 1.9): `bin/crymble-web build minesweeper`.
targets:
  minesweeper:
    main: src/minesweeper-gui.cr

crystal: ">= 1.0.0"

license: MIT

# The web build's page links its source here (bin/crymble-web build).
repository: https://github.com/wolfgang371/minesweeper

dependencies:
  crymble-ui:
    github: wolfgang371/crymbleui
